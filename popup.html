<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rolles Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main class="app">

    <header class="header">
      <div>
        <h1>Rolles</h1>
        <p>Assistente de projetos</p>
      </div>

      <button id="menuButton" class="icon-button" type="button" aria-label="Menu">
        ⋮
      </button>
    </header>

    <section id="menu" class="menu hidden">
      <button type="button" data-action="new">Novo projeto</button>
      <button type="button" data-action="history">Histórico</button>
      <button type="button" data-action="settings">Configurações</button>
    </section>

    <section class="chat" id="messages">
      <div class="welcome">
        <div class="logo">R</div>
        <h2>O que vamos criar hoje?</h2>
        <p>
          Descreve o projeto que queres criar e vamos organizar a ideia.
        </p>
      </div>
    </section>

    <div class="quick-actions">
      <button type="button" data-prompt="Quero criar um SaaS">SaaS</button>
      <button type="button" data-prompt="Quero criar um site">Site</button>
      <button type="button" data-prompt="Quero criar um aplicativo">App</button>
      <button type="button" data-prompt="Quero criar um mini jogo">Jogo</button>
    </div>

    <form id="chatForm" class="composer">
      <textarea
        id="messageInput"
        rows="2"
        placeholder="Descreve o teu projeto..."
        autocomplete="off"
      ></textarea>

      <button id="sendButton" type="submit" aria-label="Enviar">
        ↑
      </button>
    </form>

    <div id="status" class="status"></div>

  </main>

  <script src="popup.js"></script>
</body>
</html>
